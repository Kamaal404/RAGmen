[project]
name = "lattice-forge"
version = "0.1.0"
description = "Deterministic source registry and chunking machinery for Lattice"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
resolve = ["rapidfuzz>=3.0"]
neo4j = ["neo4j>=5.10"]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 300

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
