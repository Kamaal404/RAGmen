site_name: RAGmen
site_description: Turn documents into a knowledge graph. Ask questions. Get cited answers.
site_url: https://kamaal404.github.io/RAGmen
repo_url: https://github.com/Kamaal404/RAGmen
repo_name: Kamaal404/RAGmen
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/originals/ragmen-logo.png
  favicon: assets/originals/ragmen-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - What is RAGmen?: guide/what-is-ragmen.md
    - Installation: guide/installation.md
    - Your First Graph: guide/first-graph.md
  - Blueprint Design:
    - Overview: blueprint/overview.md
    - Designing a schema: blueprint/schema-design.md
    - Reference example: blueprint/reference.md
  - Command Reference:
    - forge: reference/forge.md
    - lattice-serve: reference/serve.md
    - agent: reference/agent.md
  - Troubleshooting: troubleshooting.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Kamaal404/RAGmen
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!

copyright: Copyright &copy; 2026 Kamaal404
