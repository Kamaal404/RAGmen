[project]
name = "lattice-agent"
version = "0.1.0"
description = "Answer policy layer — read-only agent that calls Serve tools and formats cited answers"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
lattice-agent = "agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 300

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]